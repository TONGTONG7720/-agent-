# LiteLLM gateway config -- unify all models as OpenAI-compatible endpoints.
# Keep API keys in environment variables (.env), never hard-code here.
# Docs: https://docs.litellm.ai/docs/proxy/configs
# NOTE: ASCII-only comments on purpose (avoid GBK decode error on zh-CN Windows).

model_list:
  # -- Tongyi Qwen (Aliyun DashScope, OpenAI-compatible mode) --
  - model_name: qwen-plus
    litellm_params:
      model: openai/qwen-plus
      api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: os.environ/DASHSCOPE_API_KEY

  # -- DeepSeek official --
  - model_name: deepseek-v3
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY

  # -- Zhipu GLM --
  - model_name: glm-4
    litellm_params:
      model: openai/glm-4-plus
      api_base: https://open.bigmodel.cn/api/paas/v4
      api_key: os.environ/ZHIPU_API_KEY

  # -- Third-party relay (OpenAI-compatible); gpt-5.x verified available on this relay --
  # Register the same model_name multiple times to enable load-balance / failover.
  - model_name: gpt-5.4-mini          # fast/cheap: good for PM / Tester / Reviewer
    litellm_params:
      model: openai/gpt-5.4-mini
      api_base: os.environ/RELAY_BASE_URL
      api_key: os.environ/RELAY_API_KEY
  - model_name: gpt-5.4
    litellm_params:
      model: openai/gpt-5.4
      api_base: os.environ/RELAY_BASE_URL
      api_key: os.environ/RELAY_API_KEY
  - model_name: gpt-5.6               # stronger: good for Architect / Coder
    litellm_params:
      model: openai/gpt-5.6
      api_base: os.environ/RELAY_BASE_URL
      api_key: os.environ/RELAY_API_KEY

litellm_settings:
  num_retries: 2                # gateway-level auto retry (design doc section 5, first fallback)
  request_timeout: 120
  drop_params: true             # drop params unsupported by the downstream model

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY   # agent service uses this as api_key
