spring:
  datasource:
    url: jdbc:h2:mem:test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always

app:
  agent-base-url: http://localhost:8001
  internal-token: change-me
  aes-key: 0123456789abcdef
  workspace-root: ${java.io.tmpdir}/magent-test-workspace
  relay-enabled: false
